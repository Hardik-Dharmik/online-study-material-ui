<div class="login-container">
    <h2>Login</h2>

    <form [formGroup]="loginForm" class="login-form">
        <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" required />
            <mat-error *ngIf="loginForm.get('email')?.invalid">{{getEmailErrorMessage()}}</mat-error>
        </mat-form-field>

        <mat-form-field class="mt-2">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" required />
            <mat-error *ngIf="loginForm.get('password')?.invalid">{{getPasswordErrorMessage()}}</mat-error>
        </mat-form-field>

        <div class="flex justify-center mt-2">
            <button mat-raised-button (click)="login()" class="w-1/2">Login</button>
        </div>

        <div class="flex justify-center items-center mt-2">
            <span>Don't have an account ? </span>
            <a mat-button (click)="gotoSignUp()">Signup</a>
        </div>
    </form>
</div>
